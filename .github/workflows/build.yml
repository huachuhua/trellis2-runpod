name: Build and Push TRELLIS.2 RunPod Worker

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      full_build:
        description: "1 = reconstruir todo (dependencias y pesos, ~30 min). Vacío = solo el handler sobre la imagen ya validada"
        default: ""
      bake_weights:
        description: "Hornear los pesos de TRELLIS.2 en la imagen (1) o bajarlos al volumen al arrancar (0)"
        default: "1"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify output transport
        run: python3 -B -m unittest test_result_transport.py

      # La imagen con pesos ronda los 30 GB: sin esto el runner se queda sin disco.
      - name: Free Runner Disk Space
        run: |
          echo "Espacio inicial en disco:"
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/.ghcup
          sudo docker image prune --all --force
          echo "Espacio tras limpieza:"
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ github.event.inputs.full_build == '1' && './Dockerfile' || './Dockerfile.handler' }}
          push: true
          build-args: |
            BAKE_WEIGHTS=${{ github.event.inputs.bake_weights || '1' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Disk space after build
        if: always()
        run: df -h /
